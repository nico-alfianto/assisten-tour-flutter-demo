<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Assistant Tour</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-wrap">
  <div class="card">
    <div style="text-align:center;margin-bottom:24px">
      <div style="font-size:24px;font-weight:bold;color:#0F766E">Assistant Tour</div>
      <div style="font-size:12px;color:grey">Customer Portal</div>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab(0)">Masuk</div>
      <div class="tab" onclick="switchTab(1)">Daftar</div>
    </div>

    <form class="form active" id="loginForm" onsubmit="handleLogin(event)">
      <h3>Selamat Datang Kembali</h3>
      <small>Masuk untuk merencanakan perjalanan.</small>
      <input type="email" id="loginEmail" placeholder="Alamat Email" class="input" required>
      <input type="password" id="loginPassword" placeholder="Password" class="input" required>
      <button type="submit" class="btn-primary">Masuk Sekarang</button>
    </form>

    <form class="form" id="registerForm" onsubmit="handleRegister(event)">
      <h3>Buat Akun Baru</h3>
      <small>Lengkapi formulir untuk mulai.</small>
      <input type="text" id="regName" placeholder="Nama Lengkap" class="input" required>
      <input type="email" id="regEmail" placeholder="Alamat Email" class="input" required>
      <input type="tel" id="regPhone" placeholder="Nomor WhatsApp 12 digit" class="input" maxlength="12" required>
      <input type="password" id="regPassword" placeholder="Password" class="input" required>
      <button type="submit" class="btn-primary">Daftar Sekarang</button>
    </form>

    <hr style="margin:32px 0">
    <small>Ingin mencoba langsung?</small>
    <button class="btn-outline-dark" onclick="demoLogin()">Gunakan Akun Demo</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
